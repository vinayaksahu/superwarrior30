name: Build Android APK & Play Store AAB (TWA)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Package from CloudAPK for www.superwarrior30.com
        run: |
          node -e '
          const fs = require("fs");
          async function build() {
            const payload = {
              packageId: "com.rahultradewarrior.app",
              host: "https://www.superwarrior30.com",
              name: "Rahul Trade Warrior Academy",
              launcherName: "Trade Warrior",
              themeColor: "#0a0a0c",
              navigationColor: "#0a0a0c",
              backgroundColor: "#0a0a0c",
              startUrl: "/",
              iconUrl: "https://www.superwarrior30.com/icon-512x512.png",
              maskableIconUrl: "https://www.superwarrior30.com/icon-maskable-512x512.png",
              webManifestUrl: "https://www.superwarrior30.com/manifest.webmanifest",
              appVersion: "1.0.0.0",
              appVersionCode: 1,
              display: "standalone",
              fallbackType: "customtabs",
              splashScreenFadeOutDuration: 300,
              signingMode: "none",
              includeSourceCode: false
            };
            console.log("Requesting CloudAPK build...");
            const res = await fetch("https://pwabuilder-cloudapk.azurewebsites.net/generateAppPackage", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });
            if (!res.ok) {
              throw new Error("CloudAPK build failed: " + res.status + " " + await res.text());
            }
            const buf = await res.arrayBuffer();
            fs.writeFileSync("cloudapk_bundle.zip", Buffer.from(buf));
            console.log("Package downloaded successfully, size:", buf.byteLength);
          }
          build().catch(err => { console.error(err); process.exit(1); });
          '

      - name: Extract & Sign APK and AAB with Existing Keystore
        run: |
          mkdir -p build_output
          unzip -o cloudapk_bundle.zip -d build_output
          ls -la build_output

          # Find apksigner in preinstalled Android SDK
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"

          # Sign APK
          $APKSIGNER sign \
            --ks "apk/signing.keystore" \
            --ks-key-alias "my-key-alias" \
            --ks-pass pass:ilIbsDyNYQ79 \
            --key-pass pass:ilIbsDyNYQ79 \
            --out "apk/Rahul Trade Warrior Academy.apk" \
            "build_output/Rahul Trade Warrior Academy-unsigned.apk"

          # Copy signed APK to public/Trade-Warrior.apk for web downloads
          cp "apk/Rahul Trade Warrior Academy.apk" "public/Trade-Warrior.apk"

          # Sign AAB using jarsigner
          cp "build_output/Rahul Trade Warrior Academy-unsigned.aab" "apk/Rahul Trade Warrior Academy.aab"
          jarsigner -keystore "apk/signing.keystore" \
            -storepass ilIbsDyNYQ79 \
            -keypass ilIbsDyNYQ79 \
            "apk/Rahul Trade Warrior Academy.aab" "my-key-alias"

          # Verify signature & fingerprint
          echo "================ VERIFYING APK SIGNATURE ================"
          $APKSIGNER verify --print-certs "apk/Rahul Trade Warrior Academy.apk"
          echo "========================================================="

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Trade-Warrior-Android-Release
          path: |
            apk/Rahul Trade Warrior Academy.apk
            apk/Rahul Trade Warrior Academy.aab

      - name: Commit and Push Updated Signed APK & AAB
        uses: stefanzweifel/git-auto-commit-action@v5
        continue-on-error: true
        with:
          commit_message: "chore(android): update signed APK & AAB to www.superwarrior30.com origin"
          file_pattern: "public/Trade-Warrior.apk apk/Rahul Trade Warrior Academy.apk apk/Rahul Trade Warrior Academy.aab"
